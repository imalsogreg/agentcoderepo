app = 'agentcoderepo'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[env]]
  BASE_URL = 'https://agentcoderepo.fly.dev'
  TURSO_URL = 'libsql://agent-code-repo-prod-imalsogreg.aws-us-west-2.turso.io'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
